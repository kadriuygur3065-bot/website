<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ctrl.z_arch - Instagram</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="insta-profil">
        <!-- Üst Kısım: Fotoğraf ve İstatistikler -->
        <div class="profil-ust">
            <div class="profil-foto">
                <img src="photo.png" alt="Profil Fotoğrafı">
            </div>
            <div class="istatistikler">
                <div class="sayi-kutu">
                    <strong>16</strong>
                    <span>gönderi</span>
                </div>
                <div class="sayi-kutu">
                    <strong>36</strong>
                    <span>takipçi</span>
                </div>
                <div class="sayi-kutu">
                    <strong>62</strong>
                    <span>takip</span>
                </div>
            </div>
        </div>

        <!-- İsim ve Bio Kısmı -->
        <div class="profil-bilgi">
            <h2>ctrl.z_arch</h2>
            <p>CTRL+Z ARCH</p>
            <p class="bio-yazi">architecture life 🦉</p>
        </div>

        <!-- QR Kod ve Link Alanı (Güncellenen dosya adı eklendi) -->
        <div class="qr-bolumu">
            <img src="ctrl.z_arch_qr.png" alt="Instagram QR">
            <a href="https://instagram.com/ctrl.z_arch" target="_blank" class="takip-buton">Profili Ziyaret Et</a>
        </div>
    </div>

</body>
</html>
